name: Hong Kong backend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hong-kong-production
  cancel-in-progress: false
jobs:
  deploy:
    # Enable after the server, host fingerprint and SSH credentials are configured.
    if: vars.HK_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: vars.HK_HOST_FRONTEND == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Build temporary frontend
        if: vars.HK_HOST_FRONTEND == 'true'
        env:
          VITE_API_ORIGIN: ${{ vars.FRONTEND_API_ORIGIN }}
        run: |
          npm ci --no-audit --no-fund
          npm run build:edgeone
      - name: Prepare source archive
        env:
          HOST_FRONTEND: ${{ vars.HK_HOST_FRONTEND }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/release"
          if [[ "$HOST_FRONTEND" == 'true' ]]; then
            mkdir -p "$RUNNER_TEMP/release/dist"
            cp -R dist/edgeone "$RUNNER_TEMP/release/dist/edgeone"
          fi
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/release" .
      - name: Upload and deploy
        env:
          SSH_HOST: ${{ secrets.HK_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HK_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 1
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || exit 1
          umask 077
          key="$RUNNER_TEMP/bilabang-key"
          hosts="$RUNNER_TEMP/bilabang-known-hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          scp -i "$key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o BatchMode=yes -o ConnectTimeout=15 "$RUNNER_TEMP/release.tar.gz" "bilabang@$SSH_HOST:/opt/bilabang/incoming/$GITHUB_SHA.tar.gz"
          ssh -i "$key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o BatchMode=yes -o ConnectTimeout=15 "bilabang@$SSH_HOST" "/usr/local/bin/bilabang-deploy $GITHUB_SHA"
